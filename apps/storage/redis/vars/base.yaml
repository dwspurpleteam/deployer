app:
  config:
    appendonly: 'yes'
    dir: /data
    maxmemory: 128mb
    maxmemory-policy: noeviction
    aclfile: /usr/local/etc/redis/users.acl

  users:
    default:
      password: ENC[]
      rules: ~* &* +@all
    meet:
      password: ENC[]
      rules: ~ov_meet* &* +@all -@admin -@dangerous +scan +info
    # psrpc also stores locks as base64-encoded sha-256 keys (44 characters).
    openvidu:
      password: ENC[]
      rules: ~???????????????????????????????????????????= ~node* ~entity-reconcile-lock ~room* ~livekit* ~egress* ~ended* ~ingress* ~{ingress}* ~agent* ~psrpc* ~signal* &* +@all -@admin -@dangerous +scan +info

  environment:
    REDISCLI_AUTH: ENC[]

compose:
  services:
    redis:
      image: redis:8.10.1-alpine
      command: redis-server /usr/local/etc/redis/redis.conf
      env_file:
      - ./configs/service.env
      volumes:
      - data:/data
      - ./configs/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./configs/users.acl:/usr/local/etc/redis/users.acl:ro
      mem_limit: 256m
      healthcheck:
        test: redis-cli ping | grep -q PONG
        interval: 10s
        timeout: 5s
        retries: 12

  volumes:
    data: {}
