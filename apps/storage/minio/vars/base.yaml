app:
  environment:
    MINIO_ROOT_USER: minioadmin
    MINIO_DEFAULT_BUCKETS: openvidu-appdata
    MINIO_BROWSER: 'off'
    MINIO_UPDATE: 'off'
  endpoint: http://minio:9000
  users:
  - name: meet
    policy: meet
  policy:
    Version: '2012-10-17'
    Statement:
    - Effect: Allow
      Action:
      - s3:ListBucket
      - s3:GetBucketLocation
      Resource:
      - arn:aws:s3:::openvidu-appdata
    - Effect: Allow
      Action:
      - s3:GetObject
      - s3:PutObject
      - s3:DeleteObject
      - s3:AbortMultipartUpload
      - s3:ListMultipartUploadParts
      Resource:
      - arn:aws:s3:::openvidu-appdata/*

build:
  repository: https://github.com/minio/mc.git
  tag: RELEASE.2025-08-13T08-35-41Z

compose:
  services:
    permissions:
      image: busybox:1.38.0
      restart: 'no'
      user: 0:0
      command: chown 1001:1001 /data
      volumes:
      - data:/data

    minio:
      image: openvidu/minio:RELEASE.2026-09-22T19-25-18Z-r0
      env_file:
      - ./configs/service.env
      volumes:
      - data:/bitnami/minio/data
      mem_limit: 512m
      healthcheck:
        test: curl -fsS http://localhost:9000/minio/health/live
        interval: 10s
        timeout: 5s
        retries: 12
      depends_on:
        permissions:
          condition: service_completed_successfully

    users:
      restart: 'no'
      entrypoint: /bin/sh
      command: /config/users.sh
      env_file:
      - ./configs/service.env
      volumes:
      - ./configs/users.sh:/config/users.sh:ro
      - ./configs/policy.json:/config/policy.json:ro
      depends_on:
        minio:
          condition: service_healthy

  volumes:
    data: {}

secrets:
  environment:
    MINIO_ROOT_PASSWORD: ENC[]
  users:
    meet: ENC[]
