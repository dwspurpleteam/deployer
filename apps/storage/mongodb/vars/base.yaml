app:
  env:
    MONGODB_ROOT_USER: mongoadmin
    MONGODB_ROOT_PASSWORD: ENC[]
    MONGODB_ADVERTISED_HOSTNAME: mongo
    MONGODB_REPLICA_SET_MODE: primary
    MONGODB_REPLICA_SET_NAME: rs0
    MONGODB_REPLICA_SET_KEY: ENC[]
    MONGODB_EXTRA_FLAGS: --wiredTigerCacheSizeGB=0.25

users:
- name: meet
  password: ENC[]
  database: openvidu-meet
  roles:
  - role: readWrite
    db: openvidu-meet

compose:
  services:
    permissions:
      image: busybox:1.38.0
      restart: 'no'
      user: 0:0
      command: chown 1001:1001 /data
      volumes:
      - data:/data

    mongodb:
      image: openvidu/mongodb:8.0.29-r1
      env_file:
      - ./configs/service.env
      volumes:
      - data:/bitnami/mongodb
      networks:
        default:
          aliases:
          - mongo
      mem_limit: 768m
      ulimits:
        nofile:
          soft: 64000
          hard: 64000
      healthcheck:
        test: /opt/bitnami/mongodb/bin/mongosh --quiet --eval 'db.getSiblingDB("admin").auth(process.env.MONGODB_ROOT_USER, process.env.MONGODB_ROOT_PASSWORD); if (!db.hello().isWritablePrimary) quit(1)'
        interval: 10s
        timeout: 5s
        retries: 12
      depends_on:
        permissions:
          condition: service_completed_successfully

    users:
      image: openvidu/mongodb:8.0.29-r1
      restart: 'no'
      entrypoint: /opt/bitnami/mongodb/bin/mongosh
      command: --host mongo --quiet --file /config/users.js
      env_file:
      - ./configs/service.env
      volumes:
      - ./configs/users.js:/config/users.js:ro
      depends_on:
        mongodb:
          condition: service_healthy

  volumes:
    data: {}
