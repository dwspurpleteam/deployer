app:
  port: 4222
  http: 127.0.0.1:8222
  authorization:
    user: admin
    password: ENC[]
  jetstream:
    store_dir: /data/jetstream
    max_memory_store: 33554432 # 32 MiB
    max_file_store: 1073741824 # 1 GiB

compose:
  services:
    nats:
      image: nats:2.15.1-alpine
      command: nats-server --config /etc/nats/nats-server.conf
      volumes:
      - data:/data
      - ./configs/nats-server.conf:/etc/nats/nats-server.conf:ro
      mem_limit: 256m
      healthcheck:
        test: wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true'
        interval: 10s
        timeout: 3s
        retries: 6

  volumes:
    data: {}
