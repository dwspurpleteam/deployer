app:
  networks:
    storage: null
  config:
    redis: null
    rtc:
      tcp_port: 8881
      port_range_start: 8900
      port_range_end: 8999
    turn:
      udp_port: 3479
      relay_range_start: 40100
      relay_range_end: 40150
    webhook:
      urls:
      - http://meet-stage:6080/livekit/webhook

compose:
  services:
    openvidu: null

    openvidu-stage:
      command: --config /etc/livekit.yaml
      networks:
        default:
          interface_name: media
      ports:
      - 8881:8881/tcp
      - 8900-8999:8900-8999/udp
      - 3479:3479/udp
      - 40100-40150:40100-40150/udp
      volumes:
      - ./configs/livekit.yaml:/etc/livekit.yaml:ro
      mem_limit: 1g
      healthcheck:
        test: wget -q --spider http://localhost:7880/
        interval: 5s
        timeout: 3s
        retries: 12

secrets:
  api_key: ENC[]
  api_secret: ENC[]
  redis_password: null
