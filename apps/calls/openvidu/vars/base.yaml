build:
  repository: https://github.com/dwspurpleteam/openvidu-livekit.git
  tag: 3.9.0

app:
  keys:
    "mvpkey": ENC[]

  port: 7880
  rtc:
    node_ip: 153.76.163.163
    use_external_ip: false
    tcp_port: 7881
    port_range_start: 7900
    port_range_end: 7999
  redis:
    address: redis:6379
    username: openvidu
    password: ENC[]
  turn:
    enabled: true
    udp_port: 3478
    relay_range_start: 40000
    relay_range_end: 40050
  webhook:
    api_key: "mvpkey"
    urls:
    - http://meet:6080/livekit/webhook
    - http://streamapi:19080/webhooks/livekit
  openvidu:
    analytics:
      enabled: false
  logging:
    level: info
    pion_level: warn

compose:
  services:
    openvidu:
      command: --config /etc/livekit.yaml
      ports:
      - 7881:7881/tcp
      - 7900-7999:7900-7999/udp
      - 3478:3478/udp
      - 40000-40050:40000-40050/udp
      volumes:
      - ./configs/livekit.yaml:/etc/livekit.yaml:ro
      mem_limit: 1g
      healthcheck:
        test: wget -q --spider http://localhost:7880/
        interval: 5s
        timeout: 3s
        retries: 12
