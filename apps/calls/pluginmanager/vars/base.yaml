build:
  repository: https://github.com/dwspurpleteam/plugin-manager-service.git
  tag: a97e68589da2935a7c955eeaadb34b5d45e69444

app:
  env:
    REDIS_URL: ENC[]
    DB_HOST: postgres
    DB_NAME: plugin_manager
    DB_USERNAME: plugin_manager
    DB_PASSWORD: ENC[]
    DB_MIGRATION_USERNAME: plugin_manager_migration
    DB_MIGRATION_PASSWORD: ENC[]
    QUARKUS_FLYWAY_MIGRATION_MIGRATE_AT_START: 'true'
    PLUGIN_MANAGER_REGISTRIES_LOCAL_URL: http://pluginregistry:8080

compose:
  services:
    pluginmanager:
      env_file:
      - ./configs/service.env
      mem_limit: 512m
      stop_grace_period: 30s
      healthcheck:
        test: curl -fsS http://127.0.0.1:8080/q/openapi
        interval: 10s
        timeout: 5s
        retries: 12
