app:
  env:
    DB_URL: jdbc:postgresql://postgres:5432/plugin_registry
    DB_USERNAME: plugin_registry
    DB_PASSWORD: ENC[]
    SPRING_FLYWAY_ENABLED: 'false'

compose:
  services:
    pluginregistry:
      image: ghcr.io/dwspurpleteam/pluginregistry:52aa3e8c07bd7e37d26befbccbdc132854883c06
      env_file:
      - ./configs/service.env
      mem_limit: 512m
      stop_grace_period: 30s
      healthcheck:
        test: wget -qO- http://127.0.0.1:8080/health
        interval: 10s
        timeout: 5s
        retries: 12
