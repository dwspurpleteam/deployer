app:
  worker_processes: auto
  worker_connections: 8192
  listen: 8080
  resolver: 127.0.0.11
  resolver_valid: 5s
  max_body_size: 10m
  proxy_timeout: 3600s
  redirect: /meet/
  absolute_redirect: 'off'
  upstreams:
    meet: meet:6080
    openvidu: openvidu:7880
  routes:
    /meet: meet
    /rtc: openvidu
  streamapi:
    enabled: true
    http:
      listen: 19080
      upstream: streamapi:19080
      keepalive: 16
      keepalive_timeout: 4s
      webhook:
        connect_timeout: 1s
        send_timeout: 3s
        read_timeout: 3s
        retry_timeout: 5s
        attempts: 2
    grpc:
      listen: 19090
      upstream: streamapi:19090
      hash: $streamapi_call_key
      connect_timeout: 1s
      read_timeout: 24h
      send_timeout: 3600s
      max_concurrent_streams: 512

compose:
  services:
    nginx:
      image: nginx:1.28.2-alpine
      volumes:
      - ./configs/main.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      mem_limit: 64m
      ulimits:
        nofile:
          soft: 65536
          hard: 65536
      healthcheck:
        test: wget -qO- http://127.0.0.1:8080/healthz
        interval: 5s
        timeout: 3s
        retries: 12
