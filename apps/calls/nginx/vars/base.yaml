app:
  listen: 8080
  resolver: 127.0.0.11
  resolver_valid: 5s
  max_body_size: 10m
  proxy_timeout: 3600s
  redirect: /meet/
  absolute_redirect: 'off'
  upstreams:
    meet: meet:6080
    openvidu: openvidu:7880
  routes:
    /meet: meet
    /rtc: openvidu

compose:
  services:
    nginx:
      image: nginx:1.28.2-alpine
      volumes:
      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      mem_limit: 64m
      healthcheck:
        test: wget -qO- http://127.0.0.1:8080/healthz
        interval: 5s
        timeout: 3s
        retries: 12
