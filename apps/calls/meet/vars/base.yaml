  tag: v3.9.0

app:
  env:
    SERVER_PORT: '6080'
    MEET_NAME_ID: openviduMeet-MVP
    MEET_LOG_LEVEL: info
    MEET_BASE_PATH: /meet
    MEET_BASE_URL: https://calls.vareonix.cc
    MEET_COOKIE_SECURE: 'true'
    MEET_INITIAL_ADMIN_USER: admin
    MEET_INITIAL_ADMIN_PASSWORD: ENC[]
    MEET_INITIAL_API_KEY: ENC[]
    MEET_INITIAL_WEBHOOK_ENABLED: 'false'
    MEET_CAPTIONS_ENABLED: 'false'
    LIVEKIT_URL: wss://calls.vareonix.cc
    LIVEKIT_URL_PRIVATE: ws://openvidu:7880
    LIVEKIT_API_KEY: ENC[YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IFgyNTUxOSBqQjV5Z0gzKy9VOXlETTdnZFQ5clU2b2RvcXc1L0VPRFZYbTZWaWxBaXpJCm91ZHZmdncwUklNYTQrVlRZNDlQUTRaNUsxQldNSlpuQUczeHNRUldaM1UKLS0tIEhKQ04yT3hpamd3aDM5NjVaelAyTVNkV05WVTJUMnJTZkd3UHBZejZ0bzQKJ809v8K5lDf4jHnuFHxqKvHTJN2CfFoKgIxqjlTuxp3Cj8p4CRc=]
    LIVEKIT_API_SECRET: ENC[]
    MEET_MONGO_URI: ENC[]
    MEET_MONGO_DB_NAME: openvidu-meet
    MEET_MONGO_MAX_POOL_SIZE: '20'
    MEET_REDIS_HOST: redis
    MEET_REDIS_PORT: '6379'
    MEET_REDIS_USERNAME: meet
    MEET_REDIS_PASSWORD: ENC[]
    MEET_REDIS_DB: '0'
    MEET_S3_BUCKET: openvidu-appdata
    MEET_S3_SUBBUCKET: openvidu-meet
    MEET_S3_SERVICE_ENDPOINT: http://minio:9000
    MEET_S3_ACCESS_KEY: meet
    MEET_S3_SECRET_KEY: ENC[]
    MEET_AWS_REGION: us-east-1
    MEET_S3_WITH_PATH_STYLE_ACCESS: 'true'

compose:
  x-composer:
    networks:
      storage:
        namespace: storage
        environment: prod

  services:
    meet:
      env_file:
      - ./configs/service.env
      mem_limit: 768m
      healthcheck:
        test: 'node -e "fetch(''http://localhost:6080/meet/'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
        interval: 10s
        timeout: 5s
        retries: 12
