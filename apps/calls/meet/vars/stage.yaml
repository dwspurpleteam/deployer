compose:
  services:
    meet: null

    meet-stage:
      env_file:
      - ./configs/service.env
      mem_limit: 768m
      healthcheck:
        test: 'node -e "fetch(''http://localhost:6080/meet/'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
        interval: 10s
        timeout: 5s
        retries: 12
