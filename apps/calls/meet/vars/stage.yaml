app:
  environment:
    LIVEKIT_URL_PRIVATE: ws://openvidu-stage:7880
    MEET_REDIS_DB: '1'

compose:
  services:
    meet: null

    meet-stage:
      env_file:
      - ./configs/service.env
      mem_limit: 768m
      healthcheck:
        test: 'node -e "fetch(''http://localhost:6080/meet/'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
        interval: 10s
        timeout: 5s
        retries: 12

secrets:
  environment:
    LIVEKIT_API_KEY: ENC[]
    LIVEKIT_API_SECRET: ENC[]
