app:
  env:
    SPRING_PROFILES_ACTIVE: prod
    JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=70.0'

compose:
  services:
    attendance:
      image: ghcr.io/dwspurpleteam/attendance:7aa7b2f2f69c6bc0827220e8abca1693a460a2c0
      env_file:
      - ./configs/service.env
      mem_limit: 384m
      stop_grace_period: 30s
      deploy:
        replicas: 1
      healthcheck:
        test: wget -qO- http://127.0.0.1:8081/actuator/health
        interval: 10s
        timeout: 5s
        retries: 12
        start_period: 60s
