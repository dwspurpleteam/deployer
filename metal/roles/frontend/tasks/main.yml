---
- name: install rsync
  ansible.builtin.apt:
    name: rsync
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: create frontend directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: autobot
    group: autobot
    mode: '0755'
  loop:
    - /srv/dwspurpleteam
    - /srv/dwspurpleteam/static
    - /srv/dwspurpleteam/static/stage
    - /srv/dwspurpleteam/static/prod
