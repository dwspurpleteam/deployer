---
- name: main | setup groups
  ansible.builtin.include_tasks: groups.yml

- name: main | setup users
  ansible.builtin.include_tasks: users.yml

- name: main | setup ssh keys
  ansible.builtin.include_tasks: ssh_keys.yml

- name: main | setup sudo config
  ansible.builtin.include_tasks: sudo.yml

- name: main | setup SSH authentication
  ansible.builtin.include_tasks: ssh.yml
  when: users_ssh_settings | length > 0
