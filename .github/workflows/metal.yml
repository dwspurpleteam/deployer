name: metal

on:
  push:
    branches: [main]
    paths:
      - metal/**
      - .github/workflows/metal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency: metal

jobs:
  setup:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: run ansible
        working-directory: metal
        env:
          ANSIBLE_SSH_USER: ${{ secrets.ANSIBLE_SSH_USER }}
          ANSIBLE_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ANSIBLE_SSH_AGENT: auto
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook cluster.yml -e "ansible_user=$ANSIBLE_SSH_USER"
