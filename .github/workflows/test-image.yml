name: test-image

on:
  push:
    branches: [ci/image-updates]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - run: |
          sed -i -E 's|(image: ghcr.io/dwspurpleteam/streamapi:)[0-9a-f]{40}|\16157ca2b3a6e09aa4f430e2be25c73d43112d12e|' apps/calls/streamapi/vars/base.yaml
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: images/test
          base: main
          title: 'тест создания pr'
          commit-message: 'тест создания pr'
          body: 'тестовый pr, будет закрыт после проверки.'
